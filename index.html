<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thala 7 Sneakers Store - The Best Sneakers</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>


    <div class="Main-container">
        <header id="header" class="header">

            <div class="nav">
                <div class="nav-left-section">
                    <h1>Thala<span>7</span></h1>
                </div>
                <div class="nav-center-section">
                    <a href="#">Home</a>
                    <a href="#">About</a>
                    <a href="#">Brands</a>
                    <a href="#">More</a>
                    <a href="#">contact</a>
                </div>
                <div class="nav-right-section">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="search" class="search" placeholder="search">
                    </div>
                    <div class="cart-box">
                        <i class="fa-solid fa-cart-arrow-down"></i><span>0</span>
                    </div>
                    <i class="fa-solid fa-circle-user user"></i>
                </div>
            </div>
        </header>

        <main id="Main">
            <div class="hero">
                <div class="left-hero">
                    <h1 class="hero-heading">Find Your Perfect <span>Pair!</span></h1>
                    <p class="hero-para">Explore the latest collection of trendy sneakers crafted for every step you
                        take.</p>
                    <button class="btn hero-btn">Explore Collection</button>
                </div>
                <div class="right-hero">
                    <img class="hero-img" src="images/shoe_main.png" alt="hero section shoe image">
                </div>
            </div>
        </main>
    </div>

</body>

</html>
